name: CI

# Runs on every push to main and every pull request. release.yml calls it
# (workflow_call) so a tag publishes an image only after the same checks pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  audit:
    name: Dependency advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  filter:
    name: Open WebUI filter, Claude Code and Codex scripts (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install aiohttp pydantic pytest
      - run: python -m pytest -q openwebui/ claude-code/ codex/ scripts/extraction_recall

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # The layer cache is shared with release.yml (same scope), so a tag on a
      # commit that CI already built rebuilds nothing.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: context-guard
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,mode=max,scope=linux/amd64
      - name: Smoke-test the image
        run: |
          docker run -d --name cg -p 127.0.0.1:7432:7432 context-guard
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7432/healthz && break; sleep 1; done
          docker exec cg context-guard healthcheck
          docker rm -f cg
