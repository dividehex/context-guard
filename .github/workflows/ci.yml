name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  audit:
    name: Dependency advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  filter:
    name: Open WebUI filter, Claude Code and Codex scripts (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install aiohttp pydantic pytest
      - run: python -m pytest -q openwebui/ claude-code/ codex/ scripts/extraction_recall

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t context-guard .
      - name: Smoke-test the image
        run: |
          docker run -d --name cg -p 127.0.0.1:7432:7432 context-guard
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:7432/healthz && break; sleep 1; done
          docker exec cg context-guard healthcheck
          docker rm -f cg
