# Add the `context-guard` service to the compose file that runs LiteLLM and
# Open WebUI, and give the `litellm` service the two environment variables.
# Nothing depends on Context Guard: if it is down, inference is unaffected.
#
# `build.context` assumes this repository is cloned next to your compose file
# (e.g. `git clone https://github.com/dividehex/context-guard`); an absolute path
# works too.
services:
  context-guard:
    build:
      context: ./context-guard
    image: context-guard
    container_name: context-guard
    restart: unless-stopped
    # user: "1000:1000"           # match the owner of ./data/context-guard if it is not uid 10001
    ports:
      - "127.0.0.1:7432:7432"     # optional, for curl/debugging; other containers use the service name
    volumes:
      - ./data/context-guard:/data
    environment:
      RUST_LOG: info
      CONTEXT_GUARD_DATABASE: /data/context-guard.db
      CONTEXT_GUARD_RETENTION_DAYS: "30"
      # CONTEXT_GUARD_MODEL_LIMITS: "my-model=32768"   # only for models whose LiteLLM model_info lacks max_input_tokens
      # CONTEXT_GUARD_METRICS_LISTEN: 0.0.0.0:7433     # optional metrics-only listener for a Prometheus on another host
    networks:
      - backend                   # the network LiteLLM and Open WebUI are on

  litellm:
    environment:
      GENERIC_LOGGER_ENDPOINT: http://context-guard:7432/api/v1/ingest/litellm
      DEFAULT_FLUSH_INTERVAL_SECONDS: "1"

networks:
  backend:
